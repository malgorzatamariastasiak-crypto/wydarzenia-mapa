<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lato z Bogiem – mapa wydarzeń 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
margin: 0;
background: #f5efe3;
font-family: 'Nunito', sans-serif;
}

.wrapper {
max-width: 1500px;
margin: 0 auto;
padding: 20px;
}

.hero {
display: grid;
grid-template-columns: 360px 1fr;
gap: 20px;
}

.sidebar {
background: rgba(255,255,255,0.75);
border-radius: 28px;
padding: 24px;
}

.logo {
font-family: 'Baloo 2', cursive;
font-size: 60px;
color: #1e4fb2;
}

.logo span {
display:block;
color:#f07c00;
font-size:40px;
}

.subtitle {
font-size: 28px;
font-weight: 800;
margin-top: 10px;
}

.section {
margin-top: 20px;
}

#map {
height: 860px;
width: 100%;
border-radius: 24px;
}

.map-container {
background:#efe4cf;
border-radius:30px;
padding:20px;
}

.popup-title {
font-weight:800;
color:#1e4fb2;
}

.popup-type {
display:inline-block;
padding:5px 10px;
border-radius:999px;
color:white;
font-size:12px;
}
</style>
</head>

<body>

<div class="wrapper">
<div class="hero">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">Lato <span>z Bogiem</span></div>
<div class="subtitle">Mapa wydarzeń 2026</div>

<div class="section">
<h3>Filtr</h3>

<select id="filter">
<option value="all">Wszystkie</option>
<option value="Spotkanie">Spotkanie</option>
<option value="Rekolekcje">Rekolekcje</option>
<option value="Pielgrzymka">Pielgrzymka</option>
<option value="Festiwal">Festiwal</option>
<option value="Obóz">Obóz</option>
<option value="Koncert">Koncert</option>
</select>
</div>

</div>

<!-- MAPA -->
<div class="map-container">
<div id="map"></div>
</div>

</div>
</div>

<script>
// BOUNDS
const polandBounds = [
[49.8, 13.5],
[54.0, 24.5]
];

// MAPA
const map = L.map('map', {
maxBounds: polandBounds,
maxBoundsViscosity: 1.0
});

map.fitBounds(polandBounds, {
padding: [20, 20],
animate: false
});

// TILE
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
attribution: '&copy; OpenStreetMap'
}).addTo(map);

// KOLORY
const colors = {
"Spotkanie": "#ef476f",
"Rekolekcje": "#118ab2",
"Pielgrzymka": "#06d6a0",
"Festiwal": "#f07c00",
"Obóz": "#7a5cc9",
"Koncert": "#ffd166",
};

// DANE (skrócone – możesz wkleić swoje pełne)
const events = [
{
name: "Impreza ŻAR",
city: "Elbląg",
coords: [54.152, 19.404],
type: "Spotkanie",
start: "14 czerwca 2025",
link: "#"
},
{
name: "Festiwal Życia",
city: "Kokotek",
coords: [50.675, 18.742],
type: "Festiwal",
start: "6–12 lipca 2026",
link: "#"
}
];

// WARSTWY
const layers = {
Spotkanie: L.layerGroup().addTo(map),
Rekolekcje: L.layerGroup().addTo(map),
Pielgrzymka: L.layerGroup().addTo(map),
Festiwal: L.layerGroup().addTo(map),
Obóz: L.layerGroup().addTo(map),
Koncert: L.layerGroup().addTo(map)
};

// IKONA
function createIcon(color) {
return L.divIcon({
className: '',
html: `<div style="background:${color};width:20px;height:20px;border-radius:50%"></div>`,
iconSize: [20, 20],
iconAnchor: [10, 10]
});
}

// MARKERY
events.forEach(e => {
const marker = L.marker(e.coords, {
icon: createIcon(colors[e.type] || '#1e4fb2')
});

marker.bindPopup(`
<div class="popup-title">${e.name}</div>
<div>${e.city}</div>
<div class="popup-type" style="background:${colors[e.type]}">${e.type}</div>
`);

if (layers[e.type]) {
marker.addTo(layers[e.type]);
}
});

// FILTR
document.getElementById("filter").addEventListener("change", e => {
const val = e.target.value;

Object.values(layers).forEach(l => map.removeLayer(l));

if (val === "all") {
Object.values(layers).forEach(l => map.addLayer(l));
} else {
map.addLayer(layers[val]);
}
});
</script>

</body>
</html>
