<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lato z Bogiem – mapa wydarzeń 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
margin: 0;
background: #f5efe3;
font-family: 'Nunito', sans-serif;
color: #163d8f;
}

.wrapper {
max-width: 1500px;
margin: 0 auto;
padding: 20px;
}

/* 🔥 ZMIANA TUTAJ */
.hero {
display: flex;
flex-direction: column;
gap: 20px;
}

.sidebar {
background: rgba(255,255,255,0.75);
border-radius: 28px;
padding: 24px;
box-shadow: 0 8px 30px rgba(0,0,0,0.08);
position: sticky;
top: 20px;
}

.logo {
font-family: 'Baloo 2', cursive;
font-size: 72px;
line-height: 0.9;
color: #1e4fb2;
}

.logo span {
display:block;
color:#f07c00;
font-size:56px;
}

.subtitle {
font-size: 40px;
font-weight: 800;
line-height: 1;
margin-top: 10px;
}

.section { margin-top: 30px; }

.sidebar-image {
margin-top: 30px;
text-align: center;
}

.sidebar-image img {
width: 100%;
max-width: 260px;
height: auto;
display: block;
margin: 0 auto;
}

.map-container {
position: relative;
background:#efe4cf;
border-radius:30px;
padding:20px;
box-shadow:0 10px 40px rgba(0,0,0,0.08);
overflow:hidden;
}

#map {
height: 70vh;   /* 🔥 lepsze na telefon */
min-height: 500px;
width: 100%;
border-radius:24px;
}

.leaflet-popup-content-wrapper {
border-radius:18px;
padding:10px;
font-family:'Nunito', sans-serif;
}

.popup-title {
font-size:18px;
font-weight:800;
margin-bottom:8px;
color:#1e4fb2;
}

.popup-type {
display:inline-block;
padding:6px 10px;
border-radius:999px;
font-size:13px;
font-weight:700;
margin-top:8px;
color:white;
}

.popup-link {
display:inline-block;
margin-top:12px;
font-weight:800;
color:#f07c00;
text-decoration:none;
}
</style>
</head>

<body>

<div class="wrapper">
<div class="hero">

<div class="sidebar">
<div class="logo">Lato <span>z Bogiem</span></div>

<div class="subtitle">
Mapa wydarzeń 2026
</div>

<div class="section">
<h3>Rodzaj wydarzenia</h3>
<div class="legend-item"><div class="dot"></div>Spotkanie</div>
</div>

<div class="section">
<h3>Zobacz listę wydarzeń</h3>
<a href="https://docs.google.com/spreadsheets/d/1IAt13h42i94PD5KT82yZYzeTCM5pEZQIb2Gm_wQ2F9A/edit?gid=0#gid=0"
target="_blank"
class="popup-link">
→ Pełna lista wydarzeń
</a>
</div>

</div>

<!-- 🔥 MAPA JEST TERAZ POD TYTUŁEM -->
<div class="map-container">
<div id="map"></div>
</div>

</div>
</div>

<script>
const map = L.map('map').setView([52.1, 19.4], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
</script>

</body>
</html>
