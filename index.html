<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lato z Bogiem – mapa wydarzeń 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
margin: 0;
background: #f5efe3;
font-family: 'Nunito', sans-serif;
color: #163d8f;
}

.wrapper {
max-width: 1200px;
margin: 0 auto;
padding: 15px;
}

/* 🟢 MOBILE-FIRST LAYOUT */
.hero {
display: block;
}

.logo {
font-family: 'Baloo 2', cursive;
font-size: 42px;
text-align: center;
color: #1e4fb2;
}

.logo span {
display:block;
color:#f07c00;
font-size:30px;
}

.subtitle {
text-align:center;
font-size: 20px;
font-weight: 800;
margin-bottom: 10px;
}

/* 🟢 MAPA POD TYTUŁEM */
.map-container {
background:#efe4cf;
border-radius:20px;
padding:10px;
}

#map {
width: 100%;
height: 75vh;   /* 🔥 idealne na telefon */
border-radius:16px;
}

/* desktop */
@media (min-width: 1000px) {
#map {
height: 85vh;
}
}

/* popup */
.popup-title {
font-size:16px;
font-weight:800;
color:#1e4fb2;
}

.popup-type {
display:inline-block;
padding:5px 10px;
border-radius:999px;
font-size:12px;
color:white;
margin-top:6px;
}
</style>
</head>

<body>

<div class="wrapper">

<!-- TYTUŁ -->
<div class="logo">
Lato <span>z Bogiem</span>
</div>

<div class="subtitle">
Mapa wydarzeń 2026
</div>

<!-- MAPA -->
<div class="map-container">
<div id="map"></div>
</div>

</div>

<script>
const polandBounds = [
[49.8, 13.5],
[54.0, 24.5]
];

const map = L.map('map', {
maxBounds: polandBounds,
maxBoundsViscosity: 1.0
});

map.fitBounds(polandBounds, {
padding: [20, 20],
animate: false
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
attribution: '&copy; OpenStreetMap'
}).addTo(map);

const colors = {
"Spotkanie": "#ef476f",
"Rekolekcje": "#118ab2",
"Pielgrzymka": "#06d6a0",
"Festiwal": "#f07c00",
"Obóz": "#7a5cc9",
"Koncert": "#ffd166",
};

const events = [
{
name: "Impreza ŻAR",
city: "Elbląg",
coords: [54.152, 19.404],
type: "Spotkanie",
start: "14 czerwca 2025",
link: "#"
},
{
name: "Festiwal Życia",
city: "Kokotek",
coords: [50.675, 18.742],
type: "Festiwal",
start: "6–12 lipca 2026",
link: "#"
}
];

function createIcon(color) {
return L.divIcon({
className: '',
html: `<div style="background:${color};width:18px;height:18px;border-radius:50%"></div>`,
iconSize: [18, 18],
iconAnchor: [9, 9]
});
}

events.forEach(e => {
const marker = L.marker(e.coords, {
icon: createIcon(colors[e.type] || '#1e4fb2')
}).addTo(map);

marker.bindPopup(`
<div class="popup-title">${e.name}</div>
<div>${e.city}</div>
<div class="popup-type" style="background:${colors[e.type]}">${e.type}</div>
`);
});

window.addEventListener('load', () => {
setTimeout(() => {
map.invalidateSize();
map.fitBounds(polandBounds, {
padding: [20, 20]
});
}, 200);
});
</script>

</body>
</html>
